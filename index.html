<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rettskrivingstrener med diktat</title>

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --ink:#f8fafc;
  --muted:#cbd5e1;
  --line:#334155;
  --good:#22c55e;
  --bad:#ef4444;
  --accent:#38bdf8;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,#020617,#1e293b);
  color:var(--ink);
}

.wrap{
  max-width:980px;
  margin:auto;
  padding:18px;
}

h1{
  margin:0 0 8px;
  font-size:28px;
}

.card{
  background:rgba(17,24,39,.95);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

button,select,input,textarea{
  font:inherit;
  border-radius:12px;
  border:1px solid var(--line);
  padding:10px 12px;
}

button{
  background:var(--accent);
  color:#00111f;
  font-weight:800;
  cursor:pointer;
}

button.secondary{
  background:#1e293b;
  color:var(--ink);
}

button.bad{
  background:var(--bad);
  color:white;
}

input,select,textarea{
  background:#020617;
  color:var(--ink);
}

textarea{
  width:100%;
  min-height:100px;
}

.bigword{
  min-height:110px;
  display:grid;
  place-items:center;
  font-size:42px;
  font-weight:900;
  background:#020617;
  border:1px dashed var(--line);
  border-radius:18px;
  margin:14px 0;
  text-align:center;
  padding:12px;
}

.answer{
  width:100%;
  font-size:28px;
  text-align:center;
  font-weight:800;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
}

.stat{
  background:#020617;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}

.stat b{
  font-size:24px;
}

.good{color:var(--good)}
.badtext{color:var(--bad)}
.muted{color:var(--muted)}
.hidden{display:none}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

td,th{
  border-bottom:1px solid var(--line);
  padding:8px;
  text-align:left;
}

.mode{
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#020617;
}
</style>
</head>

<body>

<div class="wrap">

  <h1>Rettskrivingstrener</h1>
  <p class="muted">Vanlig minnetrening eller diktat som pre-test/post-test.</p>

  <div class="card" id="setup">

    <h2>Innstillinger</h2>

    <div class="row">

      <label class="mode">
        <input type="radio" name="mode" value="memory" checked>
        Vanlig minnetrening
      </label>

      <label class="mode">
        <input type="radio" name="mode" value="dictation">
        Diktat
      </label>

      <label id="testTypeWrap" class="mode hidden">
        Test:
        <select id="testType">
          <option value="pre">Pre-test</option>
          <option value="post">Post-test</option>
        </select>
      </label>

    </div>

    <br>

    <div class="row">

      <label>
        Nivå:
        <select id="level"></select>
      </label>

      <label id="timeWrap">
        Visningstid:
        <select id="time">
          <option value="1">1 sekund</option>
          <option value="3" selected>3 sekunder</option>
          <option value="5">5 sekunder</option>
          <option value="10">10 sekunder</option>
          <option value="custom">Egendefinert</option>
        </select>
      </label>

      <label id="customTimeWrap" class="hidden">
        Sekunder:
        <input id="customTime" type="number" min="0.3" step="0.1" value="2">
      </label>

      <label>
        Antall ord:
        <input id="count" type="number" min="1" max="100" value="10">
      </label>

    </div>

    <div id="voiceBox" class="hidden">

      <br>

      <div class="row">

        <label>
          Stemme:
          <select id="voiceSelect"></select>
        </label>

        <label>
          Talehastighet:
          <select id="rateSelect">
            <option value="0.7">Veldig rolig</option>
            <option value="0.8" selected>Rolig</option>
            <option value="0.9">Normal</option>
            <option value="1">Raskere</option>
          </select>
        </label>

        <button class="secondary" onclick="testVoice()">
          Test stemme
        </button>

      </div>

    </div>

    <p>
      <button onclick="startGame()">Start</button>
      <button class="secondary" onclick="toggleCustom()">Egen ordliste</button>
    </p>

    <div id="customBox" class="hidden">

      <p class="muted">
        Skriv ett ord per linje. Dette overstyrer nivåvalg.
      </p>

      <textarea id="customWords"></textarea>

    </div>

  </div>

  <div class="card hidden" id="game">

    <div class="stats">

      <div class="stat">
        Ord <br>
        <b id="progress">0/0</b>
      </div>

      <div class="stat">
        Riktige <br>
        <b class="good" id="correct">0</b>
      </div>

      <div class="stat">
        Feil <br>
        <b class="badtext" id="wrong">0</b>
      </div>

      <div class="stat">
        Poeng <br>
        <b id="score">0</b>
      </div>

    </div>

    <div class="bigword" id="wordBox">
      Klar?
    </div>

    <input
      class="answer hidden"
      id="answer"
      autocomplete="off"
      placeholder="Skriv ordet her"
    >

    <p class="row">

      <button id="checkBtn" class="hidden" onclick="checkAnswer()">
        Sjekk
      </button>

      <button id="repeatBtn" class="secondary hidden" onclick="speakCurrent()">
        Hør igjen
      </button>

      <button id="showBtn" class="secondary" onclick="showAgain()">
        Vis ordet igjen
      </button>

      <button class="bad" onclick="endGame()">
        Avslutt
      </button>

    </p>

  </div>

  <div class="card hidden" id="result">

    <h2>Resultat</h2>

    <div id="summary"></div>

    <table id="resultTable"></table>

    <p>
      <button onclick="location.reload()">
        Start på nytt
      </button>
    </p>

  </div>

</div>

let words = [];
let current = "";
let currentSentence = "";
let index = 0;
let correct = 0;
let wrong = 0;
let score = 0;
let log = [];
let showing = false;
let mode = "memory";
let testType = "pre";
let voices = [];

const levelSelect = document.getElementById("level");

Object.keys(levels).forEach(name=>{
  const opt=document.createElement("option");
  opt.value=name;
  opt.textContent=name;
  levelSelect.appendChild(opt);
});

document.querySelectorAll("input[name='mode']").forEach(radio=>{
  radio.addEventListener("change",updateModeUI);
});

document.getElementById("time").addEventListener("change",()=>{
  document.getElementById("customTimeWrap").classList.toggle(
    "hidden",
    document.getElementById("time").value !== "custom"
  );
});

document.getElementById("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter") checkAnswer();
});

function updateModeUI(){

  mode=document.querySelector("input[name='mode']:checked").value;

  const dictation = mode==="dictation";

  document.getElementById("testTypeWrap").classList.toggle("hidden",!dictation);
  document.getElementById("voiceBox").classList.toggle("hidden",!dictation);
  document.getElementById("timeWrap").classList.toggle("hidden",dictation);
  document.getElementById("customTimeWrap").classList.add("hidden");
  document.getElementById("showBtn").classList.toggle("hidden",dictation);
  document.getElementById("repeatBtn").classList.toggle("hidden",!dictation);
}

function loadVoices(){

  voices=speechSynthesis.getVoices();

  const select=document.getElementById("voiceSelect");
  select.innerHTML="";

  const preferred=voices.filter(v=>
    v.lang.toLowerCase().startsWith("nb") ||
    v.lang.toLowerCase().startsWith("no") ||
    v.lang.toLowerCase().startsWith("nn")
  );

  const list=preferred.length ? preferred : voices;

  list.forEach((voice,i)=>{
    const opt=document.createElement("option");
    opt.value=voices.indexOf(voice);
    opt.textContent=`${voice.name} (${voice.lang})`;
    select.appendChild(opt);
  });

}

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged=loadVoices;
  loadVoices();
}

function toggleCustom(){
  document.getElementById("customBox").classList.toggle("hidden");
}

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-0.5);
}

function getSeconds(){
  const t=document.getElementById("time").value;

  if(t==="custom"){
    return Number(document.getElementById("customTime").value)||2;
  }

  return Number(t);
}

function startGame(){

  mode=document.querySelector("input[name='mode']:checked").value;
  testType=document.getElementById("testType").value;

  const custom=document.getElementById("customWords").value
    .split(/\n/)
    .map(w=>w.trim())
    .filter(Boolean);

  const base=custom.length ? custom : levels[levelSelect.value];

  const wanted=Number(document.getElementById("count").value)||10;

  words=shuffle(base).slice(0,Math.min(wanted,base.length));

  index=0;
  correct=0;
  wrong=0;
  score=0;
  log=[];

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("result").classList.add("hidden");

  updateStats();
  nextWord();
}

function nextWord(){

  if(index>=words.length){
    endGame();
    return;
  }

  current=words[index];
  currentSentence=getSentence(current);

  document.getElementById("progress").textContent=
    `${index+1}/${words.length}`;

  document.getElementById("answer").value="";

  if(mode==="dictation"){

    showing=false;

    document.getElementById("wordBox").textContent=
      testType==="pre" ? "Pre-test diktat" : "Post-test diktat";

    document.getElementById("answer").classList.remove("hidden");
    document.getElementById("checkBtn").classList.remove("hidden");
    document.getElementById("repeatBtn").classList.remove("hidden");
    document.getElementById("showBtn").classList.add("hidden");

    setTimeout(()=>speakCurrent(),400);

    document.getElementById("answer").focus();

    return;
  }

  showing=true;

  document.getElementById("wordBox").textContent=current;

  document.getElementById("answer").classList.add("hidden");
  document.getElementById("checkBtn").classList.add("hidden");
  document.getElementById("repeatBtn").classList.add("hidden");
  document.getElementById("showBtn").classList.remove("hidden");

  setTimeout(()=>hideWord(),getSeconds()*1000);
}

function getSentence(word){

  const key=word.toLowerCase();

  if(sentenceBank[key]){
    const options=sentenceBank[key];
    return options[Math.floor(Math.random()*options.length)];
  }

  return "";
}

function selectedVoice(){

  const select=document.getElementById("voiceSelect");

  if(select.value==="") return null;

  return voices[Number(select.value)] || null;
}

function speakText(text,rate=null){

  return new Promise(resolve=>{

    if(!("speechSynthesis" in window)){
      resolve();
      return;
    }

    const utter=new SpeechSynthesisUtterance(text);

    utter.lang="nb-NO";
    utter.rate=rate ?? Number(document.getElementById("rateSelect").value);
    utter.pitch=1;

    const voice=selectedVoice();

    if(voice) utter.voice=voice;

    utter.onend=resolve;
    utter.onerror=resolve;

    speechSynthesis.speak(utter);

  });

}

function pause(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function speakCurrent(){

  if(!("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  await speakText(currentSentence);
  await pause(650);
  await speakText(`Skriv ${current}.`,0.72);
  await pause(550);
  await speakText(current,0.68);

}

function testVoice(){

  speechSynthesis.cancel();

  speakText(
    "Magnus spiste sjokolade til dessert. Skriv sjokolade.",
    0.78
  );

}

function hideWord(){

  showing=false;

  document.getElementById("wordBox").textContent="Skriv ordet";

  document.getElementById("answer").classList.remove("hidden");
  document.getElementById("checkBtn").classList.remove("hidden");

  document.getElementById("answer").focus();
}

function showAgain(){

  if(!current) return;

  document.getElementById("wordBox").textContent=current;

  document.getElementById("answer").classList.add("hidden");
  document.getElementById("checkBtn").classList.add("hidden");

  setTimeout(()=>hideWord(),getSeconds()*1000);
}

function normalize(s){
  return s.trim().toLowerCase();
}

function checkAnswer(){

  if(showing) return;

  const answer=document.getElementById("answer").value;

  const ok=normalize(answer)===normalize(current);

  if(ok){
    correct++;
    score+=10;
  }else{
    wrong++;
  }

  log.push({
    word:current,
    sentence:currentSentence,
    answer,
    ok
  });

  index++;

  updateStats();

  nextWord();
}

function updateStats(){

  document.getElementById("correct").textContent=correct;
  document.getElementById("wrong").textContent=wrong;
  document.getElementById("score").textContent=score;

}

function endGame(){

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const total=log.length;

  const percent=total
    ? Math.round((correct/total)*100)
    : 0;

  document.getElementById("summary").innerHTML=`
    <p><b>${correct}</b> riktige av <b>${total}</b> ord.</p>
    <p>Treffprosent: <b>${percent}%</b>.</p>
  `;

  let html=`
    <tr>
      <th>Ord</th>
      <th>Setning</th>
      <th>Du skrev</th>
      <th>Resultat</th>
    </tr>
  `;

  log.forEach(item=>{

    html+=`
      <tr>
        <td>${escapeHtml(item.word)}</td>
        <td>${escapeHtml(item.sentence)}</td>
        <td>${escapeHtml(item.answer || "—")}</td>
        <td class="${item.ok ? "good" : "badtext"}">
          ${item.ok ? "Riktig" : "Feil"}
        </td>
      </tr>
    `;

  });

  document.getElementById("resultTable").innerHTML=html;
}

function escapeHtml(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

updateModeUI();

</script>
