<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rettskrivingstrener</title>
<style>
:root{
  --bg:#f7f3e8; --card:#fffdf7; --ink:#111; --muted:#555;
  --line:#d8cdb8; --accent:#ffd166; --good:#0a8f3c; --bad:#d62828;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Arial,sans-serif;
  background:
    linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.65)),
    repeating-linear-gradient(0deg,#f7f3e8 0,#f7f3e8 34px,#e7ddc9 35px);
  color:var(--ink);
}
.wrap{max-width:980px;margin:auto;padding:18px}
h1{margin:0;font-size:34px}
.card{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:22px;
  padding:20px;
  margin:16px 0;
  box-shadow:0 8px 0 #d8cdb8;
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{
  font:inherit;
  border-radius:14px;
  border:2px solid #222;
  padding:10px 14px;
}
button{background:var(--accent);color:#111;font-weight:900;cursor:pointer}
button.secondary{background:#e0f4ff}
button.bad{background:#ffadad}
input,select,textarea{background:white;color:#111}
textarea{width:100%;min-height:100px}
.bigword{
  min-height:120px;
  display:grid;
  place-items:center;
  font-size:44px;
  font-weight:950;
  background:#fff;
  border:3px dashed #111;
  border-radius:22px;
  margin:16px 0;
  text-align:center;
  padding:16px;
}
.answer{width:100%;font-size:32px;text-align:center;font-weight:900}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
}
.stat{
  background:#fff;
  border:2px solid var(--line);
  border-radius:16px;
  padding:12px;
}
.stat b{font-size:26px}
.good{color:var(--good)}
.badtext{color:var(--bad)}
.muted{color:var(--muted)}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px;background:white}
td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.mode{
  padding:10px 12px;
  border:2px solid #222;
  border-radius:14px;
  background:#fff;
}
</style>
</head>

<body>
<div class="wrap">
  <h1>Rettskrivingstrener</h1>
  <p class="muted">Minnetrening eller diktat som pre-test/post-test.</p>

  <div class="card" id="setup">
    <h2>Innstillinger</h2>

    <div class="row">
      <label class="mode"><input type="radio" name="mode" value="memory" checked> Vanlig minnetrening</label>
      <label class="mode"><input type="radio" name="mode" value="dictation"> Diktat</label>

      <label id="testTypeWrap" class="mode hidden">
        Test:
        <select id="testType">
          <option value="pre">Pre-test</option>
          <option value="post">Post-test</option>
        </select>
      </label>
    </div>

    <br>

    <div class="row">
      <label>Nivå: <select id="level"></select></label>

      <label id="timeWrap">Visningstid:
        <select id="time">
          <option value="1">1 sekund</option>
          <option value="3" selected>3 sekunder</option>
          <option value="5">5 sekunder</option>
          <option value="10">10 sekunder</option>
          <option value="custom">Egendefinert</option>
        </select>
      </label>

      <label id="customTimeWrap" class="hidden">
        Sekunder:
        <input id="customTime" type="number" min="0.3" step="0.1" value="2">
      </label>

      <label>Antall ord:
        <input id="count" type="number" min="1" max="100" value="10">
      </label>
    </div>

    <div id="voiceBox" class="hidden">
      <br>
      <div class="row">
        <label>Stemme:
          <select id="voiceSelect"></select>
        </label>

        <label>Talehastighet:
          <select id="rateSelect">
            <option value="0.7">Veldig rolig</option>
            <option value="0.8" selected>Rolig</option>
            <option value="0.9">Normal</option>
            <option value="1">Raskere</option>
          </select>
        </label>

        <button class="secondary" onclick="testVoice()">Test stemme</button>
      </div>
    </div>

    <p>
      <button onclick="startGame()">Start</button>
      <button class="secondary" onclick="toggleCustom()">Egen ordliste</button>
    </p>

    <div id="customBox" class="hidden">
      <p class="muted">Skriv ett ord per linje. Dette overstyrer nivåvalg.</p>
      <textarea id="customWords"></textarea>
    </div>
  </div>

  <div class="card hidden" id="game">
    <div class="stats">
      <div class="stat">Ord<br><b id="progress">0/0</b></div>
      <div class="stat">Tid<br><b id="timer">00:00</b></div>
      <div class="stat">Riktige<br><b class="good" id="correct">0</b></div>
      <div class="stat">Feil<br><b class="badtext" id="wrong">0</b></div>
      <div class="stat">Poeng<br><b id="score">0</b></div>
    </div>

    <div class="bigword" id="wordBox">Klar?</div>

    <input class="answer hidden" id="answer" autocomplete="off" placeholder="Skriv her">

    <p class="row">
      <button id="checkBtn" class="hidden" onclick="checkAnswer()">Sjekk</button>
      <button id="repeatBtn" class="secondary hidden" onclick="speakCurrent()">Hør igjen</button>
      <button id="showBtn" class="secondary" onclick="showAgain()">Vis ordet igjen</button>
      <button class="bad" onclick="endGame()">Avslutt</button>
    </p>
  </div>

  <div class="card hidden" id="result">
    <h2>Resultat</h2>
    <div id="summary"></div>
    <table id="resultTable"></table>
    <p><button onclick="location.reload()">Start på nytt</button></p>
  </div>
</div>

<script>
const levels = {
  "Nivå 1 – korte lydrette ord": ["sol","bil","hus","mus","mat","bok","tog"],
  "Nivå 2 – lydrette ord": ["lampe","skole","vinter","sommer","blyant","katt","hund"],
  "Nivå 3 – dobbelt konsonant": ["ball","hoppe","klemme","sammen","gammel","nøkkel"],
  "Nivå 4 – sj-lyd og kj-lyd": ["sjokolade","skjorte","skje","skjære","kjøkken","kjøre","kjøleskap","kjærlighet"],
  "Nivå 5 – ng, nk og gn": ["ringe","penger","finger","regn","vogn","tenke"],
  "Nivå 6 – stumme bokstaver": ["hjelp","hjem","hjerte","hvit","hvem","hvor","gjøre","gjerne","gjest"],
  "Nivå 7 – vanlige vanskelige ord": ["alltid","aldri","egentlig","kanskje","dessverre","selvfølgelig","plutselig","gjennom","menneske","nødvendig","annerledes","forskjellig","tilgjengelig","interessert"],
  "Nivå 8 – høyeste nivå": ["nysgjerrig","interessant","journalist","abonnere","restaurant","diskusjon","situasjon","bevisst","uavhengig","parallell","komplisert","konsekvens","eksperiment","kommunikasjon","konsentrasjon","sannsynlighet","gjennomsnitt","oppmerksomhet","hensiktsmessig"]
};

const sentenceBank = {
  sol:["Vi så en sol på himmelen.","Sara tegnet en sol over huset."],
  bil:["Pappa kjøpte en ny bil.","Vi satt i en bil mens det regnet."],
  hus:["Det lå et rødt hus nederst i bakken.","Familien bodde i et lite hus ved skogen."],
  mus:["En liten mus løp under skapet.","Katten så etter en mus."],
  mat:["Etter turen fikk vi mat.","Barna pakket mat i sekken."],
  bok:["Lina fant en spennende bok.","Han la en bok i sekken."],
  tog:["Vi tok tog til byen.","Et tog kjørte ut fra stasjonen."],

  lampe:["Det sto en lampe på bordet.","Bestemor slo på en lampe før hun leste."],
  skole:["Barna gikk på skole hver dag.","Det var mange elever på skole i dag."],
  vinter:["Vi fikk mye snø en kald vinter.","Det var en lang vinter med mye is."],
  sommer:["Vi badet mye en varm sommer.","Det var en lang og fin sommer."],
  blyant:["Omar brukte en blyant da han skrev.","Det lå en blyant på pulten."],
  katt:["Det lå en katt i vinduskarmen.","Vi så en svart katt i gården."],
  hund:["Vi møtte en glad hund i parken.","Det sto en hund ved døra."],

  ball:["Mina kastet en ball til vennen sin.","Det lå en ball bak sofaen."],
  hoppe:["Barna ville hoppe tau i friminuttet.","Frosken prøvde å hoppe over steinen."],
  klemme:["Hun fikk en klemme før hun dro.","Bamsen fikk en klemme etter leggetid."],
  sammen:["Vi ryddet klasserommet sammen.","De bygde en hytte sammen."],
  gammel:["Det lå en gammel bok på bordet.","Han fant en gammel nøkkel i skuffen."],
  nøkkel:["Han fant en nøkkel under matta.","Det lå en nøkkel i lomma."],

  sjokolade:["Magnus spiste sjokolade til dessert.","Hun kjøpte sjokolade på vei hjem.","Jeg liker sjokolade."],
  skjorte:["Han tok på seg en skjorte før besøket.","Det hang en skjorte på stolen."],
  skje:["Hun rørte i suppa med en skje.","Det lå en skje på gulvet."],
  skjære:["Bestefar skulle skjære brød.","Kokken skulle skjære grønnsaker."],
  kjøkken:["Det luktet brød fra et kjøkken.","Vi samlet oss på et kjøkken om morgenen."],
  kjøre:["Vi skulle kjøre til hytta.","Bussen måtte kjøre sakte."],
  kjøleskap:["Melka sto i et kjøleskap.","Hun åpnet et kjøleskap for å finne ost."],
  kjærlighet:["Filmen handlet om kjærlighet.","Bestemor sa at kjærlighet vises i det man gjør."],

  ringe:["Mamma måtte ringe skolen.","Det begynte å ringe i telefonen."],
  penger:["Han sparte penger til en ny sykkel.","Hun fant penger i lomma."],
  finger:["Hun fikk maling på en finger.","Han holdt opp en finger."],
  regn:["Det kom regn akkurat da vi skulle ut.","Vi hørte regn mot vinduet."],
  vogn:["Babyen sov i en vogn.","De trillet en vogn over brua."],
  tenke:["Jeg måtte tenke før jeg svarte.","Hun satte seg ned for å tenke."],

  hjelp:["Han rakte opp hånda og ba om hjelp.","Med litt hjelp klarte hun oppgaven."],
  hjem:["Vi gikk hjem etter kampen.","Han gledet seg til å komme hjem."],
  hjerte:["Hun tegnet et hjerte på kortet.","Det var et rødt hjerte på arket."],
  hvit:["Den lille katten var hvit.","Snøen gjorde hagen hvit."],
  hvem:["Læreren spurte hvem som ville lese.","Hvem la boka på bordet?"],
  hvor:["Hun visste ikke hvor nøkkelen var.","Hvor skal vi møtes?"],
  gjøre:["Hva skal vi gjøre i friminuttet?","De måtte gjøre leksene før middag."],
  gjerne:["Jeg vil gjerne være med.","Hun hjelper gjerne til."],
  gjest:["Vi fikk en gjest på besøk.","Det kom en gjest til middag."],

  alltid:["Han husker alltid å lukke døra.","Bestemor sier alltid hei."],
  aldri:["Hun hadde aldri sett så mye snø.","Vi går aldri over veien uten å se oss for."],
  egentlig:["Han visste egentlig svaret.","Egentlig ville hun bare være hjemme."],
  kanskje:["Kanskje kommer det snø i morgen.","Vi kan kanskje rekke bussen."],
  dessverre:["Dessverre var butikken stengt.","Jeg kan dessverre ikke bli med."],
  selvfølgelig:["Selvfølgelig skal vi hjelpe deg.","Det er selvfølgelig lov å spørre."],
  plutselig:["Plutselig begynte det å regne.","Plutselig hørte vi en lyd."],
  gjennom:["Vi gikk gjennom skogen.","Sola skinte gjennom vinduet."],
  menneske:["Et menneske trenger mat og søvn.","Et menneske kan lære hele livet."],
  nødvendig:["Det var nødvendig å ta med klær.","Noen ganger er det nødvendig å øve mer."],
  annerledes:["Dagen ble annerledes enn vi trodde.","Hun valgte en annerledes løsning."],
  forskjellig:["Barna hadde forskjellig farge på jakkene.","Vi fikk forskjellig svar på oppgaven."],
  tilgjengelig:["Boka var tilgjengelig på biblioteket.","Læreren var tilgjengelig etter timen."],
  interessert:["Han var interessert i dinosaurer.","Hun ble interessert da forsøket startet."],

  nysgjerrig:["Amina ble nysgjerrig da hun så nøkkelen.","En nysgjerrig katt undersøkte posen."],
  interessant:["Læreren fortalte en interessant historie.","Det var en interessant bok."],
  journalist:["En journalist intervjuet elevene.","En journalist skrev om saken."],
  abonnere:["Familien ville abonnere på avisa.","Han ville abonnere på et blad."],
  restaurant:["Familien spiste på en restaurant.","Vi fant en restaurant ved sjøen."],
  diskusjon:["Det ble en god diskusjon i klassen.","Vi hadde en diskusjon om rettferdighet."],
  situasjon:["Det var en vanskelig situasjon.","Hun var i en ny situasjon."],
  bevisst:["Han tok et bevisst valg.","Læreren var bevisst på beskjeden."],
  uavhengig:["Hun ville være uavhengig.","Avisen skal være uavhengig."],
  parallell:["De to linjene var parallell med hverandre.","Vi tegnet en parallell linje."],
  komplisert:["Oppgaven var komplisert.","Forklaringen ble komplisert."],
  konsekvens:["Det fikk en tydelig konsekvens.","En konsekvens av regnet var at kampen ble avlyst."],
  eksperiment:["Klassen gjorde et eksperiment.","Et eksperiment viste hva som skjer når vann fryser."],
  kommunikasjon:["God kommunikasjon gjør samarbeid lettere.","Kommunikasjon mellom hjem og skole er viktig."],
  konsentrasjon:["Eleven trengte konsentrasjon under prøven.","Det var vanskelig å holde konsentrasjon i bråket."],
  sannsynlighet:["Vi regnet på sannsynlighet.","Sannsynlighet handler om hvor trolig noe er."],
  gjennomsnitt:["Klassen fant gjennomsnitt av resultatene.","Vi regnet ut gjennomsnitt."],
  oppmerksomhet:["Hunden ville ha oppmerksomhet.","Læreren fikk klassens oppmerksomhet."],
  hensiktsmessig:["Det var en hensiktsmessig løsning.","Det er hensiktsmessig å bruke en tabell."]
};

let words=[], current="", currentSentence="", index=0, correct=0, wrong=0, score=0, log=[], showing=false;
let mode="memory", testType="pre", voices=[], lockedVoice=null;
let startTime=null, timerInterval=null, elapsedSeconds=0;

const levelSelect=document.getElementById("level");

Object.keys(levels).forEach(name=>{
  const opt=document.createElement("option");
  opt.value=name;
  opt.textContent=name;
  levelSelect.appendChild(opt);
});

document.querySelectorAll("input[name='mode']").forEach(radio=>{
  radio.addEventListener("change",updateModeUI);
});

document.getElementById("time").addEventListener("change",()=>{
  document.getElementById("customTimeWrap").classList.toggle("hidden",document.getElementById("time").value!=="custom");
});

document.getElementById("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter") checkAnswer();
});

function updateModeUI(){
  mode=document.querySelector("input[name='mode']:checked").value;
  const dictation=mode==="dictation";
  document.getElementById("testTypeWrap").classList.toggle("hidden",!dictation);
  document.getElementById("voiceBox").classList.toggle("hidden",!dictation);
  document.getElementById("timeWrap").classList.toggle("hidden",dictation);
  document.getElementById("customTimeWrap").classList.add("hidden");
  document.getElementById("showBtn").classList.toggle("hidden",dictation);
  document.getElementById("repeatBtn").classList.toggle("hidden",!dictation);
}

function loadVoices(){
  voices=speechSynthesis.getVoices();
  const select=document.getElementById("voiceSelect");
  select.innerHTML="";

  const preferred=voices.filter(v=>
    v.lang.toLowerCase().startsWith("nb") ||
    v.lang.toLowerCase().startsWith("no") ||
    v.lang.toLowerCase().startsWith("nn")
  );

  const list=preferred.length ? preferred : voices;

  list.forEach(voice=>{
    const opt=document.createElement("option");
    opt.value=voices.indexOf(voice);
    opt.textContent=`${voice.name} (${voice.lang})`;
    select.appendChild(opt);
  });
}

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged=loadVoices;
  loadVoices();
}

function lockVoice(){
  const select=document.getElementById("voiceSelect");
  lockedVoice = voices[Number(select.value)] || null;
}

function toggleCustom(){
  document.getElementById("customBox").classList.toggle("hidden");
}

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-0.5);
}

function getSeconds(){
  const t=document.getElementById("time").value;
  return t==="custom" ? Number(document.getElementById("customTime").value)||2 : Number(t);
}

function startTimer(){
  startTime=Date.now();
  elapsedSeconds=0;
  updateTimerDisplay();

  timerInterval=setInterval(()=>{
    elapsedSeconds=Math.floor((Date.now()-startTime)/1000);
    updateTimerDisplay();
  },250);
}

function stopTimer(){
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval=null;
  }
  if(startTime){
    elapsedSeconds=Math.max(1,Math.round((Date.now()-startTime)/1000));
  }
  updateTimerDisplay();
}

function updateTimerDisplay(){
  const m=String(Math.floor(elapsedSeconds/60)).padStart(2,"0");
  const s=String(elapsedSeconds%60).padStart(2,"0");
  document.getElementById("timer").textContent=`${m}:${s}`;
}

function startGame(){
  mode=document.querySelector("input[name='mode']:checked").value;
  testType=document.getElementById("testType").value;

  if(mode==="dictation") lockVoice();

  const custom=document.getElementById("customWords").value.split(/\n/).map(w=>w.trim()).filter(Boolean);
  const base=custom.length ? custom : levels[levelSelect.value];
  const wanted=Number(document.getElementById("count").value)||10;

  words=shuffle(base).slice(0,Math.min(wanted,base.length));
  index=0; correct=0; wrong=0; score=0; log=[];

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("result").classList.add("hidden");

  updateStats();
  startTimer();
  nextWord();
}

function nextWord(){
  if(index>=words.length){ endGame(); return; }

  current=words[index];
  currentSentence=getSentence(current);

  document.getElementById("progress").textContent=`${index+1}/${words.length}`;
  document.getElementById("answer").value="";

  if(mode==="dictation"){
    showing=false;
    document.getElementById("wordBox").textContent=testType==="pre" ? "Pre-test diktat" : "Post-test diktat";
    document.getElementById("answer").classList.remove("hidden");
    document.getElementById("checkBtn").classList.remove("hidden");
    document.getElementById("repeatBtn").classList.remove("hidden");
    document.getElementById("showBtn").classList.add("hidden");
    setTimeout(()=>speakCurrent(),400);
    document.getElementById("answer").focus();
    return;
  }

  showing=true;
  document.getElementById("wordBox").textContent=current;
  document.getElementById("answer").classList.add("hidden");
  document.getElementById("checkBtn").classList.add("hidden");
  document.getElementById("repeatBtn").classList.add("hidden");
  document.getElementById("showBtn").classList.remove("hidden");
  setTimeout(()=>hideWord(),getSeconds()*1000);
}

function getSentence(word){
  const key=word.toLowerCase();
  if(sentenceBank[key]){
    const options=sentenceBank[key];
    return options[Math.floor(Math.random()*options.length)];
  }
  return "";
}

function speakText(text,rate=null){
  return new Promise(resolve=>{
    if(!("speechSynthesis" in window)){ resolve(); return; }
    if(!text){ resolve(); return; }

    const utter=new SpeechSynthesisUtterance(text);
    utter.lang="nb-NO";
    utter.rate=rate ?? Number(document.getElementById("rateSelect").value);
    utter.pitch=1;

    if(lockedVoice) utter.voice=lockedVoice;

    utter.onend=resolve;
    utter.onerror=resolve;
    speechSynthesis.speak(utter);
  });
}

function pause(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function speakCurrent(){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();

  await speakText(currentSentence);
  await pause(650);
  await speakText(`Skriv ${current}.`,0.72);
  await pause(550);
  await speakText(current,0.68);
}

function testVoice(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  lockVoice();
  speakText("Magnus spiste sjokolade til dessert. Skriv sjokolade.",0.78);
}

function hideWord(){
  showing=false;
  document.getElementById("wordBox").textContent="Skriv ordet";
  document.getElementById("answer").classList.remove("hidden");
  document.getElementById("checkBtn").classList.remove("hidden");
  document.getElementById("answer").focus();
}

function showAgain(){
  if(!current) return;
  document.getElementById("wordBox").textContent=current;
  document.getElementById("answer").classList.add("hidden");
  document.getElementById("checkBtn").classList.add("hidden");
  setTimeout(()=>hideWord(),getSeconds()*1000);
}

function normalize(s){
  return s.trim().toLowerCase();
}

function checkAnswer(){
  if(showing) return;

  const answer=document.getElementById("answer").value;
  const ok=normalize(answer)===normalize(current);

  if(ok){ correct++; score+=10; }
  else{ wrong++; }

  log.push({word:current,sentence:currentSentence,answer,ok});
  index++;
  updateStats();
  nextWord();
}

function updateStats(){
  document.getElementById("correct").textContent=correct;
  document.getElementById("wrong").textContent=wrong;
  document.getElementById("score").textContent=score;
}

function endGame(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  stopTimer();

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const total=log.length;
  const minutes=Math.max(elapsedSeconds/60, 1/60);
  const percent=total ? Math.round((correct/total)*100) : 0;
  const correctPerMin=(correct/minutes).toFixed(1);
  const wrongPerMin=(wrong/minutes).toFixed(1);
  const totalPerMin=(total/minutes).toFixed(1);

  document.getElementById("summary").innerHTML=`
    <p><b>${correct}</b> riktige av <b>${total}</b> ord.</p>
    <p>Feil: <b>${wrong}</b>. Treffprosent: <b>${percent}%</b>.</p>
    <p>Tid: <b>${formatTime(elapsedSeconds)}</b>.</p>
    <p>Riktige per minutt: <b>${correctPerMin}</b>.</p>
    <p>Feil per minutt: <b>${wrongPerMin}</b>.</p>
    <p>Totalt forsøkte ord per minutt: <b>${totalPerMin}</b>.</p>
  `;

  let html=`
    <tr>
      <th>Ord</th>
      <th>Setning</th>
      <th>Du skrev</th>
      <th>Resultat</th>
    </tr>
  `;

  log.forEach(item=>{
    html+=`
      <tr>
        <td>${escapeHtml(item.word)}</td>
        <td>${escapeHtml(item.sentence)}</td>
        <td>${escapeHtml(item.answer || "—")}</td>
        <td class="${item.ok ? "good" : "badtext"}">${item.ok ? "Riktig" : "Feil"}</td>
      </tr>
    `;
  });

  document.getElementById("resultTable").innerHTML=html;
}

function formatTime(seconds){
  const m=String(Math.floor(seconds/60)).padStart(2,"0");
  const s=String(seconds%60).padStart(2,"0");
  return `${m}:${s}`;
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

updateModeUI();
</script>
