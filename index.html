<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rettskrivingstrener</title>
<style>
:root{
  --bg:#0f172a; --card:#111827; --ink:#f8fafc; --muted:#cbd5e1;
  --line:#334155; --good:#22c55e; --bad:#ef4444; --accent:#38bdf8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,#020617,#1e293b);
  color:var(--ink);
}
.wrap{max-width:900px;margin:auto;padding:18px}
h1{margin:0 0 8px;font-size:28px}
.card{
  background:rgba(17,24,39,.95);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{
  font:inherit;
  border-radius:12px;
  border:1px solid var(--line);
  padding:10px 12px;
}
button{
  background:var(--accent);
  color:#00111f;
  font-weight:800;
  cursor:pointer;
}
button.secondary{background:#1e293b;color:var(--ink)}
button.bad{background:var(--bad);color:white}
input,select,textarea{
  background:#020617;
  color:var(--ink);
}
textarea{width:100%;min-height:100px}
.bigword{
  min-height:110px;
  display:grid;
  place-items:center;
  font-size:54px;
  font-weight:900;
  letter-spacing:.04em;
  background:#020617;
  border:1px dashed var(--line);
  border-radius:18px;
  margin:14px 0;
  text-align:center;
}
.answer{
  width:100%;
  font-size:28px;
  text-align:center;
  font-weight:800;
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
}
.stat{
  background:#020617;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}
.stat b{font-size:24px}
.good{color:var(--good)}
.badtext{color:var(--bad)}
.muted{color:var(--muted)}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
kbd{background:#020617;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Rettskrivingstrener</h1>
  <p class="muted">Se ordet. Husk det. Skriv det riktig.</p>

  <div class="card" id="setup">
    <h2>Innstillinger</h2>

    <div class="row">
      <label>Nivå:
        <select id="level"></select>
      </label>

      <label>Visningstid:
        <select id="time">
          <option value="1">1 sekund</option>
          <option value="3" selected>3 sekunder</option>
          <option value="5">5 sekunder</option>
          <option value="10">10 sekunder</option>
          <option value="custom">Egendefinert</option>
        </select>
      </label>

      <label id="customTimeWrap" class="hidden">
        Sekunder:
        <input id="customTime" type="number" min="0.3" step="0.1" value="2">
      </label>

      <label>
        Antall ord:
        <input id="count" type="number" min="1" max="100" value="10">
      </label>
    </div>

    <p>
      <button onclick="startGame()">Start</button>
      <button class="secondary" onclick="toggleCustom()">Egen ordliste</button>
    </p>

    <div id="customBox" class="hidden">
      <p class="muted">Skriv ett ord per linje. Dette overstyrer nivåvalg.</p>
      <textarea id="customWords" placeholder="nysgjerrig&#10;interessant&#10;skjære&#10;hjelpe"></textarea>
    </div>
  </div>

  <div class="card hidden" id="game">
    <div class="stats">
      <div class="stat">Ord <br><b id="progress">0/0</b></div>
      <div class="stat">Riktige <br><b class="good" id="correct">0</b></div>
      <div class="stat">Feil <br><b class="badtext" id="wrong">0</b></div>
      <div class="stat">Poeng <br><b id="score">0</b></div>
    </div>

    <div class="bigword" id="wordBox">Klar?</div>

    <input class="answer hidden" id="answer" autocomplete="off" placeholder="Skriv ordet her">

    <p class="row">
      <button id="checkBtn" class="hidden" onclick="checkAnswer()">Sjekk</button>
      <button class="secondary" onclick="showAgain()">Vis ordet igjen</button>
      <button class="bad" onclick="endGame()">Avslutt</button>
    </p>

    <p class="muted">Trykk <kbd>Enter</kbd> for å sjekke svaret.</p>
  </div>

  <div class="card hidden" id="result">
    <h2>Resultat</h2>
    <div id="summary"></div>
    <table id="resultTable"></table>
    <p><button onclick="location.reload()">Start på nytt</button></p>
  </div>
</div>

<script>
const levels = {
  "Nivå 1 – korte lydrette ord": [
    "sol","bil","hus","mus","is","lam","pil","bok","tak","mat",
    "rot","fot","mur","ku","do","se","gå","ri","lo","fe"
  ],
  "Nivå 2 – lydrette ord": [
    "måne","rose","kake","stol","skole","fisk","melk","suppe","pute","bamse",
    "nisse","løve","katt","hund","vase","kopp","lue","jakke","stige","snor"
  ],
  "Nivå 3 – dobbelt konsonant": [
    "ball","katt","hatt","sitte","løpe","hoppe","bukke","telle","klemme","brenne",
    "sammen","vannet","gammel","snakke","stemme","pakke","rekke","hytte","tømme","rulle"
  ],
  "Nivå 4 – sj-lyd og kj-lyd": [
    "skjorte","skje","skjære","skjul","skjørt","sjelden","sjokolade","sjef","sjanse","sjiraff",
    "kjole","kjempe","kjøkken","kjøre","kjenne","kjede","kjekt","kjøtt","kjærlighet","kilde"
  ],
  "Nivå 5 – ng, nk og gn": [
    "sang","lang","trang","mange","finger","konge","penger","tunge","svinge","ringe",
    "bank","tenke","lenke","vinke","synke","tegn","regn","vogn","sagn","ligner"
  ],
  "Nivå 6 – stumme bokstaver": [
    "hjelp","hjem","hjerne","hjerte","hvit","hvem","hvor","hva","hvilken","hval",
    "godt","rødt","kaldt","sandt","gjøre","gjerne","gjemme","gjerde","gjest","gjelde"
  ],
  "Nivå 7 – vanlige vanskelige ord": [
    "alltid","aldri","egentlig","kanskje","dessverre","selvfølgelig","plutselig","fordi","igjen","gjennom",
    "menneske","vennlig","viktig","virkelig","nødvendig","annerledes","omtrent","sikkert","spennende","fortsatt"
  ],
  "Nivå 8 – høyeste nivå": [
    "nysgjerrig","interessant","sjokolade","journalist","abonnere","restaurant","diskusjon","situasjon","bevisst",
    "dessuten","uavhengig","parallell","komplisert","konsekvens","nødvendigvis","eksperiment","argumentasjon",
    "kommunikasjon","konsentrasjon","forhåpentligvis"
  ]
};

let words = [];
let current = "";
let index = 0;
let correct = 0;
let wrong = 0;
let score = 0;
let log = [];
let showing = false;

const levelSelect = document.getElementById("level");
Object.keys(levels).forEach(name => {
  const opt = document.createElement("option");
  opt.value = name;
  opt.textContent = name;
  levelSelect.appendChild(opt);
});

document.getElementById("time").addEventListener("change", () => {
  document.getElementById("customTimeWrap").classList.toggle(
    "hidden",
    document.getElementById("time").value !== "custom"
  );
});

document.getElementById("answer").addEventListener("keydown", e => {
  if(e.key === "Enter") checkAnswer();
});

function toggleCustom(){
  document.getElementById("customBox").classList.toggle("hidden");
}

function shuffle(arr){
  return [...arr].sort(() => Math.random() - 0.5);
}

function getSeconds(){
  const t = document.getElementById("time").value;
  if(t === "custom") return Number(document.getElementById("customTime").value) || 2;
  return Number(t);
}

function startGame(){
  const custom = document.getElementById("customWords").value
    .split(/\n/)
    .map(w => w.trim())
    .filter(Boolean);

  const base = custom.length ? custom : levels[levelSelect.value];
  const wanted = Number(document.getElementById("count").value) || 10;

  words = shuffle(base).slice(0, Math.min(wanted, base.length));
  index = 0;
  correct = 0;
  wrong = 0;
  score = 0;
  log = [];

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("result").classList.add("hidden");

  nextWord();
}

function nextWord(){
  if(index >= words.length){
    endGame();
    return;
  }

  current = words[index];
  showing = true;

  document.getElementById("progress").textContent = `${index + 1}/${words.length}`;
  document.getElementById("wordBox").textContent = current;
  document.getElementById("answer").value = "";
  document.getElementById("answer").classList.add("hidden");
  document.getElementById("checkBtn").classList.add("hidden");

  setTimeout(() => {
    hideWord();
  }, getSeconds() * 1000);
}

function hideWord(){
  showing = false;
  document.getElementById("wordBox").textContent = "Skriv ordet";
  document.getElementById("answer").classList.remove("hidden");
  document.getElementById("checkBtn").classList.remove("hidden");
  document.getElementById("answer").focus();
}

function showAgain(){
  if(!current) return;
  document.getElementById("wordBox").textContent = current;
  document.getElementById("answer").classList.add("hidden");
  document.getElementById("checkBtn").classList.add("hidden");

  setTimeout(() => {
    hideWord();
  }, getSeconds() * 1000);
}

function normalize(s){
  return s.trim().toLowerCase();
}

function checkAnswer(){
  if(showing) return;

  const answer = document.getElementById("answer").value;
  const ok = normalize(answer) === normalize(current);

  if(ok){
    correct++;
    score += 10;
  }else{
    wrong++;
  }

  log.push({
    word: current,
    answer: answer,
    ok: ok
  });

  index++;
  updateStats();
  nextWord();
}

function updateStats(){
  document.getElementById("correct").textContent = correct;
  document.getElementById("wrong").textContent = wrong;
  document.getElementById("score").textContent = score;
}

function endGame(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const percent = words.length ? Math.round((correct / words.length) * 100) : 0;

  document.getElementById("summary").innerHTML = `
    <p><b>${correct}</b> riktige av <b>${words.length}</b> ord.</p>
    <p>Treffprosent: <b>${percent}%</b>. Poeng: <b>${score}</b>.</p>
  `;

  let html = `
    <tr>
      <th>Ord</th>
      <th>Du skrev</th>
      <th>Resultat</th>
    </tr>
  `;

  log.forEach(item => {
    html += `
      <tr>
        <td>${escapeHtml(item.word)}</td>
        <td>${escapeHtml(item.answer || "—")}</td>
        <td class="${item.ok ? "good" : "badtext"}">
          ${item.ok ? "Riktig" : "Feil"}
        </td>
      </tr>
    `;
  });

  document.getElementById("resultTable").innerHTML = html;
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>
</body>
</html>
